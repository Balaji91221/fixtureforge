name: fixtureforge
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --pack-destination /tmp
      - run: |
          mkdir /tmp/fixtureforge-consumer
          cd /tmp/fixtureforge-consumer
          npm init -y
          npm install /tmp/ai-opensource-local-fixtureforge-0.2.0.tgz
          node --input-type=module -e "import {runDemo} from '@ai-opensource-local/fixtureforge'; if(runDemo().tickets[0].status !== 'closed') process.exit(1)"
