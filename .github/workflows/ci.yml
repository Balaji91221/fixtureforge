name: fixtureforge
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Clean install of compiled package
        run: |
          artifact=$(npm pack --json | node -e "let input='';process.stdin.on('data',c=>input+=c).on('end',()=>console.log(require('node:path').resolve(JSON.parse(input)[0].filename)))")
          cd "$(mktemp -d)"
          npm init -y
          npm install "$artifact"
          node --input-type=module -e "import {runDemo} from 'fixtureforge'; if(runDemo().tickets[0].status !== 'closed') process.exit(1)"
